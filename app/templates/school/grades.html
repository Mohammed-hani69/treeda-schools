{% extends "layouts/base.html" %}
{% block title %}المراحل التعليمية - {{ site_name }}{% endblock %}
{% block content %}
<div class="admin-layout">
    {% include "school/sidebar.html" %}
    <div class="admin-content">
        <h4 class="fw-bold mb-4"><i class="bi bi-layers"></i> المراحل التعليمية</h4>
        <div class="modern-card p-4 mb-4">
            <form method="POST" action="{{ url_for('school.add_grade') }}" class="modern-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-8"><input type="text" name="name" class="form-control" placeholder="اسم المرحلة (مثال: المرحلة الابتدائية)" required></div>
                    <div class="col-md-4"><button class="btn btn-primary w-100"><i class="bi bi-plus"></i> إضافة</button></div>
                </div>
            </form>
        </div>
        <div class="row g-4">
            {% for grade in grades %}
            <div class="col-md-4 col-lg-3">
                <div class="modern-card p-4 text-center">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <i class="bi bi-book" style="font-size:1.5rem;color:var(--primary);"></i>
                        <form method="POST" action="{{ url_for('school.delete_grade', id=grade.id) }}" class="delete-form">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-x"></i></button>
                        </form>
                    </div>
                    <h6 class="fw-bold">{{ grade.name }}</h6>
                </div>
            </div>
            {% else %}
            <div class="col-12 text-center py-5"><p class="text-secondary">لا توجد مراحل</p></div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
